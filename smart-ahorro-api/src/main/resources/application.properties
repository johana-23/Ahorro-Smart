spring.application.name=smart-ahorro-api

# Conexion MySQL (entorno local actual: smart_ahorro_ia)
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/smart_ahorro_ia}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# No modificar automaticamente las tablas
spring.jpa.hibernate.ddl-auto=none

# Desactivar Open Session in View
spring.jpa.open-in-view=false

# JWT - Smart Ahorro (private-key y public-key contienen RUTAS a archivos PEM)
smart-ahorro.jwt.private-key=${SMART_AHORRO_JWT_PRIVATE_KEY}
smart-ahorro.jwt.public-key=${SMART_AHORRO_JWT_PUBLIC_KEY}
smart-ahorro.jwt.issuer=https://auth.smart-ahorro.local
smart-ahorro.jwt.audience=smart-ahorro-api
smart-ahorro.jwt.access-token-minutes=15

# Recuperacion de contrasena
smart-ahorro.password-reset.ttl-minutes=60
smart-ahorro.password-reset.resend-seconds=60
# URL publica de Laravel; el enlace del correo apunta a su ruta /reset-password/{token}
smart-ahorro.password-reset.base-url=${SMART_AHORRO_WEB_URL:http://localhost:8000}
smart-ahorro.mail.from=${SMART_AHORRO_MAIL_FROM:no-reply@smart-ahorro.local}

# SMTP: se activa solo si se definen las variables de entorno SPRING_MAIL_HOST,
# SPRING_MAIL_PORT, SPRING_MAIL_USERNAME y SPRING_MAIL_PASSWORD.
    
# SMTP con STARTTLS obligatorio por defecto (usar puerto 587).
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
